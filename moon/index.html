<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You — Klik Bulannya</title>
<meta name="description" content="Klik bulannya. Ada yang mau dikasih tau.">
<style>
  :root{
    --bg:#070912; --bg2:#0d1120; --card:#141a2e; --line:#232c4a;
    --txt:#eef1f8; --dim:#8b93ad;
    --acc:#f5d076; --acc2:#ffe9a8;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);
    line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ============ NIGHT SKY ============ */
  #sky{position:fixed;inset:0;z-index:0;pointer-events:none}

  /* ============ STAGE ============ */
  .stage{position:fixed;inset:0;display:grid;place-items:center;z-index:2;
    transition:opacity .8s ease,transform .8s cubic-bezier(.16,1,.3,1)}
  .stage.gone{opacity:0;transform:scale(1.12);pointer-events:none}

  .moon-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:34px;padding:20px}

  /* the moon */
  .moon{position:relative;width:clamp(150px,34vw,240px);height:clamp(150px,34vw,240px);
    border-radius:50%;cursor:pointer;border:none;background:none;padding:0;
    animation:float 6s ease-in-out infinite;
    transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .moon:hover{transform:scale(1.06)}
  .moon:active{transform:scale(.97)}

  .moon .disc{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#fffdf5 0%,#f5e9c8 34%,#e3d0a3 62%,#c4ad7d 100%);
    box-shadow:0 0 60px rgba(245,224,150,.45),0 0 140px rgba(245,224,150,.22),
               inset -14px -14px 34px rgba(120,100,60,.28)}
  /* craters */
  .moon .cr{position:absolute;border-radius:50%;background:rgba(150,128,88,.22);
    box-shadow:inset 1.5px 1.5px 3px rgba(90,74,48,.35)}
  .cr.c1{width:22%;height:22%;top:20%;left:22%}
  .cr.c2{width:14%;height:14%;top:52%;left:56%}
  .cr.c3{width:10%;height:10%;top:66%;left:26%}
  .cr.c4{width:8%;height:8%;top:34%;left:68%}
  .cr.c5{width:12%;height:12%;top:74%;left:60%}

  /* glow ring */
  .moon .ring{position:absolute;inset:-22px;border-radius:50%;border:1px solid rgba(245,224,150,.18);
    animation:ringPulse 3.4s ease-in-out infinite}
  .moon .ring.r2{inset:-42px;border-color:rgba(245,224,150,.1);animation-delay:.6s}
  @keyframes ringPulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.07);opacity:.15}}

  /* hint */
  .hint{font-family:var(--mono);font-size:clamp(11px,2.6vw,13px);letter-spacing:2.4px;
    text-transform:uppercase;color:var(--dim);text-align:center;
    animation:hintBlink 2.6s ease-in-out infinite}
  @keyframes hintBlink{0%,100%{opacity:.45}50%{opacity:1}}
  .hint b{color:var(--acc);font-weight:600}

  /* ============ MESSAGE SCENE ============ */
  .scene{position:fixed;inset:0;z-index:3;display:grid;place-items:center;padding:24px;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity 1s ease,visibility 1s}
  .scene.show{opacity:1;visibility:visible;pointer-events:auto}

  .card{position:relative;max-width:520px;width:100%;text-align:center;
    background:linear-gradient(170deg,rgba(20,26,46,.92),rgba(13,17,32,.96));
    border:1px solid var(--line);border-radius:24px;
    padding:clamp(34px,6vw,54px) clamp(24px,5vw,44px);
    box-shadow:0 40px 90px -40px rgba(0,0,0,.85);
    transform:translateY(30px) scale(.96);opacity:0;
    transition:transform .9s cubic-bezier(.16,1,.3,1) .15s,opacity .9s ease .15s}
  .scene.show .card{transform:none;opacity:1}

  /* small moon inside the card */
  .card .mini{width:62px;height:62px;border-radius:50%;margin:0 auto 24px;position:relative;
    background:radial-gradient(circle at 34% 30%,#fffdf5,#f0e0b8 40%,#d8c493 100%);
    box-shadow:0 0 30px rgba(245,224,150,.4)}
  .card .mini::after{content:"";position:absolute;inset:-12px;border-radius:50%;
    border:1px solid rgba(245,224,150,.2)}

  .card .line{overflow:hidden}
  .card .line span{display:block;transform:translateY(110%);opacity:0}
  .scene.show .card .line span{animation:lineUp .8s cubic-bezier(.16,1,.3,1) forwards}
  .scene.show .card .line:nth-of-type(1) span{animation-delay:.45s}
  .scene.show .card .line:nth-of-type(2) span{animation-delay:.62s}
  .scene.show .card .line:nth-of-type(3) span{animation-delay:.79s}
  @keyframes lineUp{to{transform:translateY(0);opacity:1}}

  .ilove{font-family:var(--mono);font-size:clamp(30px,7.4vw,54px);font-weight:700;
    letter-spacing:-1px;line-height:1.1;margin-bottom:16px;
    background:linear-gradient(100deg,var(--acc),var(--acc2) 50%,#fff3cf);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:clamp(14px,3vw,16.5px);color:var(--dim);line-height:1.75;margin-bottom:8px}
  .sub b{color:var(--txt);font-weight:600}

  /* floating hearts */
  .hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:24px}
  .heart{position:absolute;bottom:-30px;font-size:18px;opacity:0;
    animation:rise linear forwards}
  @keyframes rise{
    0%{opacity:0;transform:translateY(0) scale(.6) rotate(0)}
    12%{opacity:.9}
    100%{opacity:0;transform:translateY(-360px) scale(1.15) rotate(var(--rot,20deg))}
  }

  /* replay */
  .again{margin-top:26px;font-family:var(--mono);font-size:11.5px;letter-spacing:2px;
    text-transform:uppercase;color:var(--dim);border:1px solid var(--line);
    padding:9px 20px;border-radius:100px;transition:.25s}
  .again:hover{color:var(--acc);border-color:rgba(245,224,150,.4)}

  /* ============ SHOOTING STARS ============ */
  .shoot{position:fixed;width:2px;height:2px;border-radius:50%;background:#fff;z-index:1;
    pointer-events:none;box-shadow:0 0 8px #fff}
  .shoot::after{content:"";position:absolute;left:0;top:0;width:90px;height:1px;
    background:linear-gradient(90deg,#fff,transparent);transform-origin:0 50%}

  @media print{
    .stage,.hint{display:none}
    .scene{position:static;opacity:1;visibility:visible}
    .card{box-shadow:none;border:1px solid #ddd;background:#fff;transform:none;opacity:1}
    .ilove{-webkit-text-fill-color:#8a6d1f;color:#8a6d1f}
    .sub{color:#444}
    body{background:#fff;overflow:visible}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    .scene .card .line span{transform:none;opacity:1}
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>

<!-- ============ STAGE: THE MOON ============ -->
<div class="stage" id="stage">
  <div class="moon-wrap">
    <button class="moon" id="moon" aria-label="Klik bulan">
      <span class="ring"></span>
      <span class="ring r2"></span>
      <span class="disc">
        <span class="cr c1"></span>
        <span class="cr c2"></span>
        <span class="cr c3"></span>
        <span class="cr c4"></span>
        <span class="cr c5"></span>
      </span>
    </button>
    <div class="hint">Klik <b>bulannya</b> →</div>
  </div>
</div>

<!-- ============ SCENE: THE MESSAGE ============ -->
<div class="scene" id="scene">
  <div class="card">
    <div class="hearts" id="hearts"></div>
    <div class="mini"></div>
    <div class="line"><span class="ilove">I love you.</span></div>
    <div class="line"><span class="sub">Dari langit yang sama, dari bulan yang selalu ada —<br>walau lo gak lihat, dia tetap nyala.</span></div>
    <div class="line"><span class="sub" style="margin-top:14px">Makanya jangan lupa:<br><b>lo berharga. Selalu.</b></span></div>
    <button class="again" id="again">← Lihat bulan lagi</button>
  </div>
</div>

<script>
/* ============ NIGHT SKY ============ */
(function(){
  var c = document.getElementById('sky'), ctx = c.getContext('2d');
  var w, h, stars = [], N = 190;
  function resize(){ w = c.width = innerWidth; h = c.height = innerHeight; }
  resize(); addEventListener('resize', resize);
  for (var i = 0; i < N; i++) stars.push({
    x: Math.random()*w, y: Math.random()*h,
    r: Math.random()*1.4 + .25,
    o: Math.random()*.55 + .2,
    tw: Math.random()*.025 + .004,
    ph: Math.random()*Math.PI*2,
    s: Math.random()*.06 + .015
  });
  function frame(){
    ctx.clearRect(0,0,w,h);
    for (var i = 0; i < stars.length; i++){
      var st = stars[i];
      st.ph += st.tw;
      st.y += st.s;
      if (st.y > h + 2){ st.y = -2; st.x = Math.random()*w; }
      var o = st.o * (0.55 + 0.45*Math.sin(st.ph));
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,' + o.toFixed(3) + ')';
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ============ SHOOTING STARS ============ */
(function(){
  function spawn(){
    if (document.hidden) { setTimeout(spawn, 2600); return; }
    var el = document.createElement('div');
    el.className = 'shoot';
    var sx = Math.random() * innerWidth * .7;
    var sy = Math.random() * innerHeight * .35;
    var ang = 28 + Math.random() * 16;
    el.style.left = sx + 'px';
    el.style.top = sy + 'px';
    el.style.transform = 'rotate(' + ang + 'deg)';
    el.style.transition = 'transform 1.1s linear, opacity 1.1s ease';
    document.body.appendChild(el);
    requestAnimationFrame(function(){
      el.style.transform = 'rotate(' + ang + 'deg) translateX(340px)';
      el.style.opacity = '0';
    });
    setTimeout(function(){ el.remove(); }, 1200);
    setTimeout(spawn, 2200 + Math.random() * 3200);
  }
  setTimeout(spawn, 1400);
})();

/* ============ CLICK THE MOON ============ */
(function(){
  var moon = document.getElementById('moon');
  var stage = document.getElementById('stage');
  var scene = document.getElementById('scene');
  var hearts = document.getElementById('hearts');
  var again = document.getElementById('again');
  var burst = null;

  function popHearts(){
    if (burst) clearInterval(burst);
    var glyphs = ['❤','💛','✨','🌙','💫'];
    burst = setInterval(function(){
      var h = document.createElement('span');
      h.className = 'heart';
      h.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
      h.style.left = (8 + Math.random()*84) + '%';
      h.style.fontSize = (13 + Math.random()*13) + 'px';
      h.style.animationDuration = (2.6 + Math.random()*1.8) + 's';
      h.style.setProperty('--rot', (Math.random()*70 - 35) + 'deg');
      hearts.appendChild(h);
      setTimeout(function(){ h.remove(); }, 4600);
    }, 260);
  }

  moon.addEventListener('click', function(){
    stage.classList.add('gone');
    setTimeout(function(){
      scene.classList.add('show');
      popHearts();
    }, 420);
  });

  again.addEventListener('click', function(){
    if (burst) clearInterval(burst);
    hearts.innerHTML = '';
    scene.classList.remove('show');
    setTimeout(function(){ stage.classList.remove('gone'); }, 500);
  });
})();
</script>

</body>
</html>
